          command: |
            mkdir -p /tmp/stage
            { set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=0;i<495996;i++) printf "%d\n", (i*7919)%2147483647}' | wc -l; true ; } > /tmp/stage/primary_job_output_v4.txt
            echo "gate Rollout_Service1: $(wc -c </tmp/stage/primary_job_output_v4.txt) bytes total"
      - persist_to_workspace:
          root: /tmp/stage
          paths:
            - primary_job_output_v4.txt
